# Branch temporária: recompila exatamente a v0.4.2 (commit 2c800ea) e traduz o
# crash report em crash/v0.4.2.log. Nenhuma linha de código foi alterada.
name: Traduzir crash v0.4.2

on:
  push:
  workflow_dispatch:

jobs:
  traduzir:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v5

      - name: Restaurar dependências do cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: deps/prefix
          key: deps-switch-${{ hashFiles('scripts/compilar-deps.sh', 'compat/include/**', 'compat/patches/**', 'compat/compat.cmake') }}

      - name: Compilar dependências (sem cache)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: sh scripts/compilar-deps.sh

      - name: Compilar
        run: make -j$(nproc)

      - name: Traduzir o crash report
        run: sh scripts/traduzir-crash.sh nxstream.elf crash/v0.4.2.log
