name: Build .nro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (PC)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Rodar testes
        run: make -C tests

  build:
    name: Compilar .nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar bibliotecas
        run: dkp-pacman -Sy --noconfirm --needed switch-curl switch-zlib

      - name: Compilar
        run: make -j$(nproc)

      - name: Publicar o .nro
        uses: actions/upload-artifact@v5
        with:
          name: nxstream-nro
          path: nxstream.nro
          if-no-files-found: error
