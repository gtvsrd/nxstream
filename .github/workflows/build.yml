name: Build .nro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (PC)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Rodar testes
        run: make -C tests

  build:
    name: Compilar .nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      # A imagem oficial já inclui as portlibs (curl, zlib...).
      # Downloads do pkg.devkitpro.org a partir do GitHub Actions são bloqueados.
      - name: Conferir bibliotecas
        run: ls -l $DEVKITPRO/portlibs/switch/lib/libcurl.a $DEVKITPRO/portlibs/switch/lib/libz.a

      - name: Compilar
        run: make -j$(nproc)

      - name: Publicar o .nro
        uses: actions/upload-artifact@v5
        with:
          name: nxstream-nro
          path: nxstream.nro
          if-no-files-found: error
