# Branch de análise: recompila exatamente o commit do .nro que travou e traduz
# o crash report em crash/relatorio.log. Nenhuma linha de código foi alterada.
name: Analise de crash

on:
  push:
  workflow_dispatch:

jobs:
  traduzir:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v5

      - name: Restaurar dependências do cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: deps/prefix
          key: deps-switch-${{ hashFiles('scripts/compilar-deps.sh', 'compat/include/**', 'compat/patches/**', 'compat/compat.cmake') }}

      - name: Compilar dependências (sem cache)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: sh scripts/compilar-deps.sh

      - name: Compilar
        run: make -j$(nproc)

      - name: Traduzir o crash report (todas as threads)
        run: |
          sh scripts/traduzir-crash.sh nxstream.elf crash/relatorio.log
          echo
          echo "== Todas as threads =="
          BIN=$DEVKITPRO/devkitA64/bin
          awk '/^Threads\[/{print} /\(nxstream \+ 0x/{match($0,/nxstream \+ 0x[0-9a-f]+/); print substr($0,RSTART+11,RLENGTH-11)}' crash/relatorio.log \
            | while read -r linha; do
                case "$linha" in
                  Threads*) echo; echo "$linha" ;;
                  *) printf '  %-10s ' "$linha"; $BIN/aarch64-none-elf-addr2line -f -C -p -e nxstream.elf "$linha" | cut -c1-200 ;;
                esac
              done
