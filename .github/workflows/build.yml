name: Build .nro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (PC)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Rodar testes
        run: make -C tests

  build:
    name: Compilar .nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      # As dependências do WebRTC (mbedTLS 3 + libdatachannel) levam alguns
      # minutos para compilar. Ficam em cache até o script ou a camada compat/ mudar.
      - name: Cache das dependências
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/prefix
          key: deps-switch-${{ hashFiles('scripts/compilar-deps.sh', 'compat/**') }}

      - name: Compilar dependências (sem cache)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: sh scripts/compilar-deps.sh

      # A imagem oficial já inclui as portlibs (curl, zlib...).
      # Downloads do pkg.devkitpro.org a partir do GitHub Actions são bloqueados.
      - name: Conferir bibliotecas
        run: |
          ls -l $DEVKITPRO/portlibs/switch/lib/libcurl.a $DEVKITPRO/portlibs/switch/lib/libz.a
          ls -l deps/prefix/lib/libdatachannel.a deps/prefix/lib/libmbedtls.a

      - name: Compilar
        run: make -j$(nproc)

      - name: Publicar o .nro
        uses: actions/upload-artifact@v5
        with:
          name: nxstream-nro
          path: nxstream.nro
          if-no-files-found: error
