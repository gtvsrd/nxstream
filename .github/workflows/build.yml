name: Build .nro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (PC)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Rodar testes
        run: make -C tests

  limpeza:
    name: Teste de limpeza da libdatachannel (PC)
    runs-on: ubuntu-latest
    # Só quando muda algo que afeta a libdatachannel (leva ~2 min)
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Ver se precisa rodar
        id: mudou
        run: |
          if git diff --quiet HEAD~1 HEAD -- compat/patches scripts/compilar-deps.sh tests/limpeza 2>/dev/null; then
            echo "rodar=nao" >> $GITHUB_OUTPUT; echo "Nada mudou nos patches: teste pulado"
          else
            echo "rodar=sim" >> $GITHUB_OUTPUT
          fi

      - name: Rodar teste de limpeza
        if: steps.mudou.outputs.rodar == 'sim' || github.event_name == 'workflow_dispatch'
        run: sh tests/limpeza/rodar.sh

  build:
    name: Compilar .nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      # As dependências do WebRTC (mbedTLS 3 + libdatachannel) levam alguns
      # minutos para compilar e ficam em cache. Só o que entra na compilação
      # delas define a chave (compat/src é compilado junto com o app).
      - name: Restaurar dependências do cache
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: deps/prefix
          key: deps-switch-${{ hashFiles('scripts/compilar-deps.sh', 'compat/include/**', 'compat/patches/**', 'compat/compat.cmake') }}

      - name: Compilar dependências (sem cache)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: sh scripts/compilar-deps.sh

      # Salva logo em seguida: mesmo que o app falhe depois, as dependências
      # já compiladas não precisam ser refeitas no próximo build.
      - name: Salvar dependências no cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/prefix
          key: ${{ steps.cache-deps.outputs.cache-primary-key }}

      # A imagem oficial já inclui as portlibs (curl, zlib...).
      # Downloads do pkg.devkitpro.org a partir do GitHub Actions são bloqueados.
      - name: Conferir bibliotecas
        run: |
          ls -l $DEVKITPRO/portlibs/switch/lib/libcurl.a $DEVKITPRO/portlibs/switch/lib/libz.a
          ls -l deps/prefix/lib/libdatachannel.a deps/prefix/lib/libmbedtls.a
          echo "FFmpeg: $($DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-pkg-config --modversion libavcodec 2>/dev/null || echo 'pkg-config indisponivel')"
          $DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-pkg-config --libs --static libavcodec libavutil 2>/dev/null || true

      - name: Compilar
        run: make -j$(nproc)

      - name: Publicar o .nro
        uses: actions/upload-artifact@v5
        with:
          name: NXStream-nro
          path: NXStream.nro
          if-no-files-found: error
          # Repositório privado tem cota de armazenamento para artefatos
          # (em 22/11 ela encheu com 150 builds guardados por 90 dias)
          retention-days: 30

      # O .elf tem os símbolos: serve para traduzir os endereços de um crash
      # report do Atmosphère (/atmosphere/crash_reports) em funções e linhas,
      # com scripts/traduzir-crash.sh. Não é para instalar no Switch.
      - name: Publicar o .elf (análise de crash)
        uses: actions/upload-artifact@v5
        with:
          name: NXStream-elf-para-crash-reports
          path: NXStream.elf
          if-no-files-found: error
          retention-days: 14
