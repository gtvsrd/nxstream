name: Build .nro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Compilar
        run: make -j$(nproc)

      - name: Publicar o .nro
        uses: actions/upload-artifact@v5
        with:
          name: nxstream-nro
          path: nxstream.nro
          if-no-files-found: error
